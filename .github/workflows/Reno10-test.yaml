name: Build TWRP Reno10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 清理磁盘空间
      run: |
        sudo docker image prune -a -f
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev python3 python-is-python3 repo

    - name: 设置 Repo 工具
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: 同步 TWRP 源码 (14.1 分支)
      run: |
        mkdir work
        cd work
        git config --global user.name "miaizhe"
        git config --global user.email "ftyfty2021@163.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
        repo sync -j$(nproc --all) --force-sync

    - name: 载入设备树
      run: |
        mkdir -p temp_device_tree
        rsync -av --exclude='.git' --exclude='work' ./ temp_device_tree/
        cd work
        mkdir -p device/oppo/PHW110
        cp -r ../temp_device_tree/* device/oppo/PHW110/
        ls -R device/oppo/PHW110

    - name: 开始编译
      run: |
        cd work
        source build/envsetup.sh
        lunch omni_lahaina-eng
        mka bootimage -j$(nproc)

    - name: 上传镜像
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Recovery
        path: |
          work/out/target/product/PHW110/*.img
          work/out/target/product/PHW110/*.zip
